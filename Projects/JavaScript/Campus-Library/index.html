<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple campus library catalogue.">
    <title>Campus Library</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="page-shell header-content">
            <a class="brand" href="#top" aria-label="Campus Library home">
                <span class="brand-mark" aria-hidden="true">CL</span>
                <span>Campus Library</span>
            </a>
            <p class="header-note">Discover, borrow, return.</p>
        </div>
    </header>

    <main id="top" class="page-shell">
        <section class="hero" aria-labelledby="page-title">
            <p class="eyebrow">University catalogue</p>
            <h1 id="page-title">Find your next great read.</h1>
            <p class="hero-copy">Browse the campus collection and manage a book’s availability in one place.</p>
        </section>

        <section class="statistics" aria-label="Library statistics">
            <article class="stat-card">
                <span class="stat-label">Total books</span>
                <strong id="totalBooks" class="stat-value">0</strong>
            </article>
            <article class="stat-card">
                <span class="stat-label">Available now</span>
                <strong id="availableBooks" class="stat-value">0</strong>
            </article>
            <article class="stat-card">
                <span class="stat-label">Currently borrowed</span>
                <strong id="borrowedBooks" class="stat-value">0</strong>
            </article>
        </section>

        <section class="catalogue-section" aria-labelledby="catalogue-title">
            <div class="catalogue-toolbar">
                <div>
                    <p class="eyebrow">Catalogue</p>
                    <h2 id="catalogue-title">Books</h2>
                </div>
                <label class="search-field" for="searchInput">
                    <span class="visually-hidden">Search books</span>
                    <span aria-hidden="true">⌕</span>
                    <input id="searchInput" type="search" placeholder="Search title, author, or category">
                </label>
            </div>

            <p id="resultsMessage" class="results-message" aria-live="polite"></p>
            <div id="bookGrid" class="book-grid" aria-live="polite"></div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="page-shell">Campus Library · Engineering Studio 1</div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
